name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment and Signing Keystore
        run: |
          # Create .env if missing for secrets gradle plugin
          cp .env.example .env 2>/dev/null || touch .env
          
          # Generate debug.keystore required for validateSigningDebug
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # Ensure gradlew has execute permission
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Named APK
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/VPNSettings-Build-${{ github.run_number }}.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-settings-debug-apk
          path: release-artifacts/*.apk
          retention-days: 14

      - name: Publish APK GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          name: VPN Settings Build #${{ github.run_number }}
          body: |
            ## 📱 VPN Settings Android App

            - **Build Number:** `${{ github.run_number }}`
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`

            ### 📥 ดาวน์โหลดไฟล์ติดตั้ง:
            ดาวน์โหลดไฟล์ `.apk` ด้านล่างนี้เพื่อนำไปติดตั้งบนอุปกรณ์ Android ได้ทันที
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
