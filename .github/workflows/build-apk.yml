name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-settings-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          
      - name: Publish APK GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: vpn-settings-debug Build ${{ github.run_number }}
          body: |
            Automated Android APK build.

            Commit: ${{ github.sha }}
            Workflow run: ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          
